name: Sleep TST source recovery
on:
  push:
    branches:
      - codex/sleep-tst-recovery-20260913
    paths:
      - .github/workflows/sleep-tst-source-recovery.yml
  workflow_dispatch:
permissions: {}
jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify a ZIP header and one megabyte of actual data
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time, struct, hashlib
          from datetime import datetime, timezone
          url="https://zenodo.org/api/records/15900394/files/dodo.zip/content"
          start=3572884564
          report={"checked_utc":datetime.now(timezone.utc).isoformat(),"environment":"GitHub Actions ubuntu-24.04","url":url,"checks":[]}
          def get_range(first,last):
              request=urllib.request.Request(url,headers={"Range":f"bytes={first}-{last}","Accept-Encoding":"identity","User-Agent":"sleep-tst-research/0.1"})
              with urllib.request.urlopen(request,timeout=70) as response:
                  status=response.status;content_range=response.headers.get("Content-Range","")
                  if status!=206 or not content_range.startswith(f"bytes {first}-"):
                      raise RuntimeError(f"Range mismatch: {status} {content_range}")
                  data=response.read(last-first+2)
                  if len(data)!=last-first+1:raise RuntimeError("Unexpected byte count")
              return data
          try:
              header=get_range(start,start+29)
              assert header[:4]==b"PK\x03\x04"
              fields=struct.unpack("<IHHHHHIIIHH",header)
              report["checks"].append({"step":"zip_header","status":"verified","bytes":len(header)})
              data_start=start+30+fields[-2]+fields[-1]
              block=get_range(data_start,data_start+1048576-1)
              report["checks"].append({"step":"compressed_data_block","status":"read","bytes":len(block),"sha256":hashlib.sha256(block).hexdigest()})
              report["status"]="data_transport_available"
          except Exception as exc:
              report["status"]="unavailable";report["error"]=f"{type(exc).__name__}: {exc}"
          print("SLEEP_TST_SOURCE_PROBE="+json.dumps(report),flush=True)
          PY
